<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SITEC Urbapark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
        @keyframes zoomIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
        @keyframes spin { to { transform:rotate(360deg); } }
        .fade-up { animation: fadeInUp .45s ease both; }
        .zoom-in { animation: zoomIn .2s ease both; }
        .spin { animation: spin 1s linear infinite; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#F8FAFC]">
<div id="root"></div>

<script type="text/babel" data-type="module">
import React, { useState, useEffect, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import {
  Calculator, Settings2, Users, LogOut, Menu, Bell, ChevronDown, ChevronRight,
  CreditCard, Ticket, Building, Filter, Download, Calendar, Clock, AlertCircle,
  MoreVertical, Car, Upload, X, Save, FileCheck, CheckCircle2, List,
  Store, Wallet, Landmark, FileUp, FileText, Check, AlertTriangle, RotateCw,
  Video, Camera, Image as ImageIcon, User, Loader2, History, Layers, Eye,
  Bike, BarChart3, PiggyBank, Receipt, Bus, Gift, Banknote, Smartphone,
  Utensils, Percent, Network, Server, ClipboardList, ShieldCheck, Key,
  Trash2, Plus, Pencil, ChevronLeft, ChevronUp, Unlock, Cpu, Wrench,
  LayoutList, MapPin, Play, Send, Copy, Search, ShoppingCart, File,
  ArrowUpDown
} from 'lucide-react';

/* ─────────────────────── CONSTANTS ─────────────────────── */
const PARKING_LOTS = [
  "18 de Septiembre","Aeropuerto","Aguacate Rumiñahui","Astecnia","Avalon Plaza",
  "Centro Comercial El Bosque","Centro Comercial El Recreo","Centro Comercial La Y",
  "Centro Comercial Mall del Sol","Centro Comercial Mall El Jardin",
  "Centro Comercial Naciones Unidas","Centro Comercial Paseo San Francisco",
  "Centro Comercial Policentro","Centro Comercial Real Plaza","Centro Comercial Scala",
  "Ciudad Milenium","Clinica Pasteur","Hotel Colon","Hotel LeParc","Hotel Marriot",
  "Hotel Quito","Hotel Swissotel","Supermaxi 12 de Octubre","Supermaxi San Gabriel",
  "Torre Milenium","Village Plaza"
];

/* ─────────────────────── SMALL HELPERS ─────────────────────── */
const EmptyState = ({ icon: Icon, title, desc }) => (
  <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-12 text-center flex flex-col items-center justify-center min-h-[400px] fade-up">
    <div className="p-4 bg-slate-50 rounded-full mb-4 text-slate-300"><Icon size={48} /></div>
    <h2 className="text-xl font-black text-slate-800 mb-2">{title}</h2>
    <p className="text-slate-400 text-sm max-w-md">Este módulo se encuentra actualmente en construcción. Pronto podrás acceder a todas sus funcionalidades.</p>
  </div>
);

const UploadButton = ({ label, icon, isVideo = false, uploadKey, uploads, onUpload, readOnly = false }) => {
    const status = uploads && uploads[uploadKey];
    const isDone = status === 'done';

    return (
        <div className="space-y-1">
            <label className="text-xs font-bold text-slate-700 ml-1 text-center block">{label}</label>
            <button 
                onClick={() => !readOnly && onUpload && onUpload(uploadKey)}
                disabled={(!readOnly && isDone)} 
                className={`w-full h-20 border-2 border-dashed rounded-xl flex flex-col items-center justify-center gap-2 transition-all group bg-white
                    ${status === 'loading' ? 'border-slate-300' :
                    isDone && !readOnly ? 'border-emerald-500 bg-emerald-50 text-emerald-600' : 
                    readOnly ? 'border-slate-300 bg-slate-50 text-slate-500 hover:bg-slate-100 hover:border-slate-400' : 
                    'border-slate-300 text-slate-400 hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50'} 
                `}
            >
                {status === 'loading' ? (
                    <Loader2 size={24} className="animate-spin text-blue-500" />
                ) : isDone && !readOnly ? (
                    <div className="flex flex-col items-center animate-in zoom-in duration-300">
                        <div className="p-1 bg-emerald-100 rounded-full mb-1"><Check size={16} /></div>
                        <span className="text-[10px] font-bold">Cargado</span>
                    </div>
                ) : readOnly ? (
                    <div className="flex flex-col items-center">
                        <div className="p-1 bg-slate-200 rounded-full mb-1">{icon}</div>
                        <span className="text-[10px] font-bold">Visualizar</span>
                    </div>
                ) : (
                    <>
                        <div className="text-current transition-all">
                            {icon}
                        </div>
                        <div className="text-center"><span className="font-medium text-[10px] block text-slate-400 group-hover:text-blue-500">{isVideo ? "Clic para cargar video" : "Clic para cargar"}</span></div>
                    </>
                )}
            </button>
        </div>
    );
};

/* ─────────────────────── DESCUENTO ACCESORIOS VIEW ─────────────────────── */
const RevisionModal = ({ orden, onClose, onSave }) => {
    const [facturas, setFacturas] = useState(orden.facturas || {});
    const accesoriosUnicos = Array.from(new Set((orden.items || []).map(i => i.accesorio)));
    const numOrdenDisplay = Object.values(orden.ordenes || {}).map(o => o?.orden).filter(Boolean).join(' / ') || 'S/N';

    const handleSave = () => {
        onSave(orden.id, facturas);
    };

    return (
        <div className="fixed inset-0 z-[140] flex items-center justify-center p-4">
            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onClick={onClose} />
            <div className="relative bg-[#F8FAFC] rounded-lg w-full max-w-[800px] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-start p-6 pb-4 bg-[#F8FAFC]">
                    <div>
                        <h3 className="text-[20px] font-bold text-[#1E293B] leading-tight">
                            Revisar Orden {numOrdenDisplay}
                        </h3>
                        <p className="text-[14px] text-[#64748B] mt-1">Agrega el número de factura. Las cuotas se registran automáticamente en 2.</p>
                    </div>
                    <button onClick={onClose} className="text-[14px] font-bold text-[#64748B] hover:text-[#1E293B] transition-colors pt-1">Cerrar</button>
                </div>
                
                <div className="p-6 pt-2 overflow-y-auto custom-scrollbar bg-white border-y border-slate-200">
                    {accesoriosUnicos.map(acc => {
                        const itemsAcc = (orden.items || []).filter(i => i.accesorio === acc);
                        const totalValor = parseFloat((orden.ordenes || {})[acc]?.total || 0);
                        const valorPorPersona = itemsAcc.length > 0 ? totalValor / itemsAcc.length : 0;

                        return (
                            <div key={acc} className="mb-8">
                                <div className="flex items-center gap-3 mb-4">
                                    <h4 className="font-bold text-[#1E293B] text-[16px] capitalize">{acc}</h4>
                                    <label className="text-[13px] font-bold text-[#64748B] uppercase tracking-wider ml-2">NÚMERO DE FACTURA</label>
                                    <input 
                                        type="text" 
                                        placeholder="Número de factura" 
                                        className="px-4 py-2 border border-slate-200 rounded-lg text-[14px] outline-none focus:border-blue-400 text-slate-700 shadow-sm w-[220px] transition-colors bg-white placeholder:text-[#94A3B8]"
                                        value={facturas[acc] || ''}
                                        onChange={e => setFacturas({...facturas, [acc]: e.target.value})}
                                    />
                                </div>
                                <div className="border border-slate-200 rounded-[12px] overflow-hidden shadow-sm">
                                    <table className="w-full text-left">
                                        <thead className="bg-[#F8FAFC] border-b border-slate-100">
                                            <tr>
                                                {['PERSONA', 'ACCESORIO', 'VALOR', 'CUOTAS'].map(h => (
                                                    <th key={h} className="px-5 py-4 text-[12px] font-bold text-[#64748B] uppercase tracking-wider">{h}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 bg-white">
                                            {itemsAcc.map((item, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-5 py-4 text-[14px] font-semibold text-[#475569] uppercase">{item.empleado}</td>
                                                    <td className="px-5 py-4 text-[14px] text-[#475569]">{item.accesorio} {item.talla && item.talla !== '—' ? `talla ${item.talla}` : ''}</td>
                                                    <td className="px-5 py-4 text-[14px] font-bold text-[#334155]">${valorPorPersona.toFixed(2).replace('.', ',')}</td>
                                                    <td className="px-5 py-4 text-[14px] font-semibold text-[#475569]">2</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        );
                    })}
                </div>

                <div className="p-4 bg-[#F8FAFC] flex justify-end items-center gap-6 shrink-0 border-t border-slate-200">
                    <button onClick={onClose} className="font-bold text-[#475569] hover:text-[#0F172A] transition-colors text-[14px]">Cancelar</button>
                    <button onClick={handleSave} className="px-6 py-2.5 rounded-lg bg-[#2563EB] hover:bg-blue-700 text-white font-bold shadow-sm active:scale-95 transition-all text-[14px]">Guardar revisión</button>
                </div>
            </div>
        </div>
    );
};

const DescuentoAccesoriosView = ({
    solicitudes, setSolicitudes,
    ordenesCompra, setOrdenesCompra,
    ordenForms, setOrdenForms
}) => {
    const [activeTab, setActiveTab] = useState('solicitar');
    const [form, setForm] = useState({ empleado: '', centro: '', accesorio: 'Botas', talla: '' });
    
    const [expandedOrden, setExpandedOrden] = useState('');
    const [showConfirm, setShowConfirm] = useState(false);
    const [showSuccess, setShowSuccess] = useState(false);
    
    // Modals
    const [modalActa, setModalActa] = useState(null);
    const [uploadingActa, setUploadingActa] = useState(false);
    const [modalRevision, setModalRevision] = useState(null);
    const [expandedOrdenRevision, setExpandedOrdenRevision] = useState(null);

    const handleAgregar = () => {
        if (!form.empleado || !form.centro) return;
        setSolicitudes(prev => [...prev, {
            id: Date.now() + Math.random(),
            empleado: form.empleado.toUpperCase(),
            cedula: '09' + Math.floor(Math.random() * 10000000), 
            centro: form.centro.toUpperCase(),
            accesorio: form.accesorio,
            talla: form.talla || '—',
            actaSubida: false
        }]);
        setForm({ empleado: '', centro: '', accesorio: 'Botas', talla: '' });
    };

    const handleGenerar = () => setShowConfirm(true);
    
    const handleConfirm = () => {
        const uniqueAccesorios = [...new Set(solicitudes.map(s => s.accesorio))];
        const initialOrdenes = {};
        uniqueAccesorios.forEach(acc => {
            initialOrdenes[acc] = { status: 'pending', archivo: '', orden: '', total: '' };
        });

        const newOrder = {
            id: 'SOL-' + Date.now(),
            fecha: new Date().toLocaleDateString('es-EC', { day:'numeric', month:'numeric', year:'numeric' }),
            estado: 'Solicitud creada',
            pasoPendiente: 'Subir órdenes',
            items: solicitudes.map(s => ({ ...s, actaSubida: false })),
            ordenes: initialOrdenes,
            facturas: {}
        };
        
        setOrdenesCompra(prev => [newOrder, ...prev]);
        setExpandedOrden(newOrder.id); 
        
        setShowConfirm(false);
        setShowSuccess(true);
    };

    const handleSuccessClose = () => {
        setShowSuccess(false);
        setSolicitudes([]); 
        setActiveTab('orden_compra'); 
    };

    const handleSubirOrdenClick = (solId, acc) => {
        setOrdenForms(prev => ({ ...prev, [`${solId}-${acc}`]: { ...prev[`${solId}-${acc}`], loading: true } }));
        setTimeout(() => {
            setOrdenesCompra(prev => prev.map(sol => {
                if (sol.id !== solId) return sol;
                const updatedOrdenes = {
                    ...sol.ordenes,
                    [acc]: { ...sol.ordenes[acc], status: 'needs_info', archivo: `Orden_compra_${acc}_2026.pdf` }
                };
                return { ...sol, ordenes: updatedOrdenes };
            }));
            setOrdenForms(prev => ({ ...prev, [`${solId}-${acc}`]: { loading: false, orden: '', total: '' } }));
        }, 1000);
    };

    const handleGuardarOrdenDetalle = (solId, acc) => {
        const formData = ordenForms[`${solId}-${acc}`];
        if (!formData || !formData.orden || !formData.total) return;

        setOrdenesCompra(prev => prev.map(sol => {
            if (sol.id !== solId) return sol;
            const updatedOrdenes = {
                ...sol.ordenes,
                [acc]: { ...sol.ordenes[acc], orden: formData.orden, total: formData.total, status: 'completed' }
            };
            const uniqueAccs = Array.from(new Set((sol.items || []).map(i => i.accesorio)));
            const allCompleted = uniqueAccs.every(a => updatedOrdenes[a] && updatedOrdenes[a].status === 'completed');
            
            return {
                ...sol,
                ordenes: updatedOrdenes,
                ...(allCompleted ? { pasoPendiente: 'Subir actas' } : {})
            };
        }));
    };

    const handleSubirActa = () => {
        setUploadingActa(true);
        setTimeout(() => {
            setUploadingActa(false);
            setOrdenesCompra(prev => prev.map(sol => {
                if (sol.id !== modalActa.solId) return sol;
                
                const updatedItems = (sol.items || []).map(item =>
                    item.id === modalActa.item.id ? { ...item, actaSubida: true } : item
                );
                
                const pendingActas = updatedItems.filter(i => !i.actaSubida).length;
                
                return { 
                    ...sol, 
                    items: updatedItems,
                    ...(pendingActas === 0 ? { estado: 'Pedido Realizado', pasoPendiente: 'Revisión' } : {})
                };
            }));
            setModalActa(null); 
        }, 1000);
    };

    const handleSaveRevision = (solId, facturas) => {
        setOrdenesCompra(prev => prev.map(sol => {
            if (sol.id !== solId) return sol;
            return { ...sol, estado: 'Revisado', pasoPendiente: 'Completado', facturas };
        }));
        setModalRevision(null);
    };

    const getActasCount = (orden) => {
        if (!orden || !orden.items) return { subidas: 0, total: 0 };
        return { subidas: orden.items.filter(i => i.actaSubida).length, total: orden.items.length };
    };

    return (
        <div className="space-y-6 fade-up pb-10">
            {modalRevision && (
                <RevisionModal 
                    orden={modalRevision} 
                    onClose={() => setModalRevision(null)} 
                    onSave={handleSaveRevision} 
                />
            )}

            {/* Header */}
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                    <div className="p-2 bg-white rounded-lg text-[#001F3F] border border-slate-200 shadow-sm"><ShoppingCart size={24} strokeWidth={2.5}/></div>
                    <div>
                        <h2 className="text-2xl font-bold text-[#001F3F] tracking-tight">Solicitud Accesorios</h2>
                    </div>
                </div>
            </div>

            {/* Tabs */}
            <div className="inline-flex items-center p-1 bg-white border border-slate-200 rounded-2xl shadow-sm">
                {['Solicitar', 'Orden de Compra', 'Revisión'].map(tab => {
                    const id = tab.toLowerCase().replace(/ /g, '_');
                    const isActive = activeTab === id;
                    return (
                        <button key={id} onClick={() => setActiveTab(id)}
                            className={`px-8 py-2.5 text-[14px] font-medium rounded-xl transition-all relative ${isActive ? 'bg-blue-50/50 text-blue-600 border border-blue-200/60 shadow-sm' : 'text-slate-600 hover:text-slate-800 hover:bg-slate-50 border border-transparent'}`}>
                            {tab}
                        </button>
                    );
                })}
            </div>

            {/* Content: Solicitar */}
            {activeTab === 'solicitar' && (
                <div className="space-y-6 animate-in fade-in zoom-in-95 duration-300 max-w-5xl">
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-8">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 border border-blue-100">
                                <ShoppingCart size={20} strokeWidth={2.5} />
                            </div>
                            <h3 className="text-lg font-black text-slate-800 tracking-wide">Nueva solicitud</h3>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                            <div>
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 block">EMPLEADO</label>
                                <input type="text" placeholder="Buscar empleado..." value={form.empleado} onChange={e=>setForm({...form, empleado: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 transition-colors text-slate-700 placeholder:text-slate-400 shadow-sm" />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 block">CENTRO DE COSTO</label>
                                <input type="text" placeholder="Buscar centro..." value={form.centro} onChange={e=>setForm({...form, centro: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 transition-colors text-slate-700 placeholder:text-slate-400 shadow-sm" />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 block">ACCESORIO</label>
                                <div className="relative">
                                    <select value={form.accesorio} onChange={e=>setForm({...form, accesorio: e.target.value})} className="w-full appearance-none pl-4 pr-10 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 transition-colors cursor-pointer text-slate-700 font-medium shadow-sm">
                                        <option value="Botas">Botas</option>
                                        <option value="Auriculares">Auriculares</option>
                                    </select>
                                    <ChevronDown className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" size={16}/>
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 block">TALLA</label>
                                <input type="text" placeholder="Escribir talla" value={form.talla} onChange={e=>setForm({...form, talla: e.target.value})} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 transition-colors text-slate-700 placeholder:text-slate-400 shadow-sm" />
                            </div>
                        </div>

                        <div className="flex justify-end">
                            <button onClick={handleAgregar} disabled={!form.empleado || !form.centro} className={`flex items-center gap-2 px-8 py-3 rounded-xl text-sm font-bold transition-all shadow-sm ${form.empleado && form.centro ? 'bg-blue-100 text-blue-700 hover:bg-blue-200 active:scale-95' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                                <Plus size={18} strokeWidth={3} /> Agregar
                            </button>
                        </div>
                    </div>

                    {solicitudes.length > 0 && (
                        <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden max-w-5xl">
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-white">
                                <div className="flex items-center gap-3">
                                    <h3 className="font-bold text-slate-800 text-base">Empleados en solicitud</h3>
                                    <span className="bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-full text-xs">{solicitudes.length}</span>
                                </div>
                                <button onClick={handleGenerar} className="px-6 py-2.5 bg-[#059669] hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md transition-all active:scale-95 flex items-center gap-2">
                                    Generar solicitud <ChevronRight size={16}/>
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 border-b border-slate-100">
                                        <tr>
                                            <th className="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Empleado</th>
                                            <th className="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Cédula</th>
                                            <th className="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Centro de costo</th>
                                            <th className="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Accesorio</th>
                                            <th className="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Talla</th>
                                            <th className="px-6 py-4 w-16"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {solicitudes.map((s) => (
                                            <tr key={s.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-6 py-4 text-[13px] font-bold text-slate-700">{s.empleado}</td>
                                                <td className="px-6 py-4 text-[13px] text-slate-500 font-mono">{s.cedula}</td>
                                                <td className="px-6 py-4 text-[13px] text-slate-600">{s.centro}</td>
                                                <td className="px-6 py-4">
                                                    <span className={`px-3 py-1 rounded-full text-[11px] font-bold ${s.accesorio === 'Botas' ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-purple-50 text-purple-600 border border-purple-200'}`}>
                                                        {s.accesorio}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 text-[13px] text-slate-700 font-medium">{s.talla}</td>
                                                <td className="px-6 py-4 text-center">
                                                    <button onClick={() => setSolicitudes(prev => prev.filter(item => item.id !== s.id))} className="text-slate-400 hover:text-red-500 transition-colors">
                                                        <Trash2 size={16}/>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            )}

            {/* Content: Orden de Compra */}
            {activeTab === 'orden_compra' && (
                <div className="bg-white rounded-[24px] border border-slate-200 shadow-sm overflow-hidden animate-in fade-in zoom-in-95 duration-300 max-w-5xl mx-auto">
                    <div className="p-6 border-b border-slate-100 bg-[#F8FAFC]">

const RecaudacionView = ({ recaudaciones, setRecaudaciones }) => {
    const [showModal, setShowModal] = useState(false);
    const [detalleModal, setDetalleModal] = useState(null);
    const [form, setForm] = useState({ parqueadero: '', usuario: '', fecha: '', observaciones: '', observacionesDeposito: '' });
    
    // Estado para Ordenamiento
    const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

    // Estado para "Concuerda Monto"
    const [concuerdaMonto, setConcuerdaMonto] = useState('si');

    // El estado de los archivos subidos es ahora individual y dinámico
    const [uploads, setUploads] = useState({ 
        planillas_pdf: null, planillas_xlsx: null, 
        depositos_hora: null, depositos_abonados: null, 
        datafast: null 
    });
    
    // Categoría activa para el despliegue de botones inferiores
    const [activeUploadCategory, setActiveUploadCategory] = useState(null);

    // Filtros
    const [filtroFecha, setFiltroFecha] = useState('');
    const [filtroEstado, setFiltroEstado] = useState('Todos');
    const [filtroParqueadero, setFiltroParqueadero] = useState('');

    const handleUpload = (key) => {
        setUploads(prev => ({ ...prev, [key]: 'loading' }));
        setTimeout(() => setUploads(prev => ({ ...prev, [key]: 'done' })), 1000);
    };

    // Helper para obtener la fecha en formato YYYY-MM-DD
    const getLocalDateStr = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    };

    // Lógica para fechas permitidas (Hoy - 3 días hasta Hoy)
    const todayObj = new Date();
    const maxDateStr = getLocalDateStr(todayObj);
    
    const minDateObj = new Date(todayObj);
    minDateObj.setDate(minDateObj.getDate() - 3);
    const minDateStr = getLocalDateStr(minDateObj);

    const handleSave = () => {
        if (!form.parqueadero || !form.usuario || !form.fecha) return;
        
        // Sumamos solo los archivos que están marcados como 'done'
        const uploadedCount = Object.keys(uploads).filter(k => uploads[k] === 'done').length;

        // Simulamos los montos desglosados
        const efe = (Math.random() * 200).toFixed(2);
        const tar = (Math.random() * 100).toFixed(2);
        const trans = (Math.random() * 50).toFixed(2);
        const cred = (Math.random() * 50).toFixed(2);
        const total = (parseFloat(efe) + parseFloat(tar) + parseFloat(trans) + parseFloat(cred)).toFixed(2);

        // Generamos el código de centro de costo
        const cCosto = '022' + Math.floor(1000 + Math.random() * 9000).toString();

        // Si "Concuerda Monto" es 'si', no enviamos observación de depósito
        const obsDepositoFinal = concuerdaMonto === 'no' ? form.observacionesDeposito : '';

        // Determinación del Estado por Fecha
        const estadoFinal = form.fecha === maxDateStr ? 'Cargado Fuera de Tiempo' : 'Cargado';

        const newRecaudacion = {
            id: 'REC-' + Math.floor(Math.random() * 1000000),
            centroCosto: cCosto,
            ...form,
            observacionesDeposito: obsDepositoFinal,
            archivos: uploadedCount,
            uploads: { ...uploads },
            estado: estadoFinal,
            montoEfectivo: efe,
            montoTarjeta: tar,
            montoTransferencia: trans,
            montoCredito: cred,
            monto: total
        };
        setRecaudaciones(prev => [newRecaudacion, ...prev]);
        setShowModal(false);
        setForm({ parqueadero: '', usuario: '', fecha: '', observaciones: '', observacionesDeposito: '' });
        setUploads({ planillas_pdf: null, planillas_xlsx: null, depositos_hora: null, depositos_abonados: null, datafast: null });
        setActiveUploadCategory(null);
        setConcuerdaMonto('si'); // Resetear
    };

    // Lógica de Ordenamiento
    const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
            direction = 'desc';
        }
        setSortConfig({ key, direction });
    };

    // Cálculos de finalización para las categorías principales
    const isPlanillasDone = uploads.planillas_pdf === 'done' || uploads.planillas_xlsx === 'done';
    const isDepositosDone = uploads.depositos_hora === 'done' || uploads.depositos_abonados === 'done';
    const isDatafastDone = uploads.datafast === 'done';

    // Aplicar Filtros (Fecha, Estado, Parqueadero)
    const filteredRecaudaciones = recaudaciones.filter(rec => {
        const matchFecha = !filtroFecha || rec.fecha === filtroFecha;
        const matchEstado = filtroEstado === 'Todos' || rec.estado === filtroEstado;
        const matchParqueadero = !filtroParqueadero || rec.parqueadero.toLowerCase().includes(filtroParqueadero.toLowerCase());
        return matchFecha && matchEstado && matchParqueadero;
    });

    // Aplicar Ordenamiento
    const sortedRecaudaciones = [...filteredRecaudaciones].sort((a, b) => {
        if (!sortConfig.key) return 0;
        const aValue = a[sortConfig.key] || '';
        const bValue = b[sortConfig.key] || '';
        if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
        if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
    });

    const totalMonto = filteredRecaudaciones.reduce((sum, rec) => sum + parseFloat(rec.monto || 0), 0);
    const summaryDateText = filtroFecha ? filtroFecha : 'Todas las fechas';

    return (
        <div className="space-y-6 fade-up pb-10 max-w-[1200px] mx-auto">
            {detalleModal && (
                <DetalleRecaudacionModal 
                    recaudacion={detalleModal} 
                    onClose={() => setDetalleModal(null)} 
                />
            )}

            {/* Cabecera Principal */}
            <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 border-b border-slate-200 pb-4">

                        <Plus size={16} className="text-orange-500 mb-1" />
                        recaudación
                    </button>
                </div>
            </div>

            {/* Contenedor Principal */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 min-h-[500px] flex flex-col">
