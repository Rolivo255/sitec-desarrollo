<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SITEC Urbapark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
        @keyframes zoomIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
        @keyframes spin { to { transform:rotate(360deg); } }
        .fade-up { animation: fadeInUp .45s ease both; }
        .zoom-in { animation: zoomIn .2s ease both; }
        .spin { animation: spin 1s linear infinite; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#F8FAFC]">
<div id="root"></div>

<script type="text/babel" data-type="module">
import React, { useState, useEffect, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import {
  Calculator, Settings2, Users, LogOut, Menu, Bell, ChevronDown, ChevronRight,
  CreditCard, Ticket, Building, Filter, Download, Calendar, Clock, AlertCircle,
  MoreVertical, Car, Upload, X, Save, FileCheck, CheckCircle2, List,
  Store, Wallet, Landmark, FileUp, FileText, Check, AlertTriangle, RotateCw,
  Video, Camera, Image as ImageIcon, User, Loader2, History, Layers, Eye,
  Bike, BarChart3, PiggyBank, Receipt, Bus, Gift, Banknote, Smartphone,
  Utensils, Percent, Network, Server, ClipboardList, ShieldCheck, Key,
  Trash2, Plus, Pencil, ChevronLeft, ChevronUp, Unlock, Cpu, Wrench,
  LayoutList, MapPin, Play, Send, Copy, Search, ShoppingCart, File,
  ArrowUpDown, Briefcase, Rocket, ListChecks, DollarSign
} from 'lucide-react';

/* ─────────────────────── CONSTANTS ─────────────────────── */
const PARKING_LOTS = [
  "18 de Septiembre","Aeropuerto","Aguacate Rumiñahui","Astecnia","Avalon Plaza",
  "Centro Comercial El Bosque","Centro Comercial El Recreo","Centro Comercial La Y",
  "Centro Comercial Mall del Sol","Centro Comercial Mall El Jardin",
  "Centro Comercial Naciones Unidas","Centro Comercial Paseo San Francisco",
  "Centro Comercial Policentro","Centro Comercial Real Plaza","Centro Comercial Scala",
  "Ciudad Milenium","Clinica Pasteur","Hotel Colon","Hotel LeParc","Hotel Marriot",
  "Hotel Quito","Hotel Swissotel","Supermaxi 12 de Octubre","Supermaxi San Gabriel",
  "Torre Milenium","Village Plaza"
];

/* ─────────────────────── SMALL HELPERS ─────────────────────── */
const EmptyState = ({ icon: Icon, title, desc }) => (
  <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-12 text-center flex flex-col items-center justify-center min-h-[400px] fade-up">
    <div className="p-4 bg-slate-50 rounded-full mb-4 text-slate-300"><Icon size={48} /></div>
    <h2 className="text-xl font-black text-slate-800 mb-2">{title}</h2>
    <p className="text-slate-400 text-sm max-w-md">Este módulo se encuentra actualmente en construcción. Pronto podrás acceder a todas sus funcionalidades.</p>
  </div>
);

const UploadButton = ({ label, icon, isVideo = false, uploadKey, uploads, onUpload, readOnly = false }) => {
    const status = uploads && uploads[uploadKey];
    const isDone = status === 'done';

    return (
        <div className="space-y-1">
            <label className="text-[11px] font-bold text-slate-700 ml-1 text-center block uppercase tracking-wider">{label}</label>
            <button 
                onClick={() => !readOnly && onUpload && onUpload(uploadKey)}
                disabled={(!readOnly && isDone)} 
                className={`w-full h-24 border-2 border-dashed rounded-xl flex flex-col items-center justify-center gap-2 transition-all group bg-white
                    ${status === 'loading' ? 'border-slate-300' :
                    isDone && !readOnly ? 'border-emerald-500 bg-emerald-50 text-emerald-600' : 
                    readOnly ? 'border-slate-300 bg-slate-50 text-slate-500 hover:bg-slate-100 hover:border-slate-400' : 
                    'border-slate-300 text-slate-400 hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50'} 
                `}
            >
                {status === 'loading' ? (
                    <Loader2 size={24} className="animate-spin text-blue-500" />
                ) : isDone && !readOnly ? (
                    <div className="flex flex-col items-center animate-in zoom-in duration-300">
                        <div className="p-1 bg-emerald-100 rounded-full mb-1"><Check size={16} /></div>
                        <span className="text-[10px] font-bold">Cargado</span>
                    </div>
                ) : readOnly ? (
                    <div className="flex flex-col items-center">
                        <div className="p-1 bg-slate-200 rounded-full mb-1">{icon}</div>
                        <span className="text-[10px] font-bold">Visualizar</span>
                    </div>
                ) : (
                    <>
                        <div className="text-orange-500 transition-all">
                            {icon}
                        </div>
                        <div className="text-center"><span className="font-medium text-[10px] block text-slate-400 group-hover:text-blue-500">Arrastra y suelta aquí el archivo para cargar, o haz clic para seleccionar archivos</span></div>
                    </>
                )}
            </button>
            <div className="flex justify-end mt-2">
                <button className="px-4 py-1.5 bg-slate-400 hover:bg-slate-500 text-white rounded-full text-[10px] font-bold transition-all shadow-sm flex items-center gap-1.5" disabled>
                    <Upload size={12}/> INICIAR CARGA DE DATOS
                </button>
            </div>
        </div>
    );
};

/* ─────────────────────── PLANTILLA PROVEEDORES VIEW ─────────────────────── */
const PlantillaProveedoresView = () => {
    // Drawer Gestionar Categorias
    const [isCatDrawerOpen, setIsCatDrawerOpen] = useState(false);
    const [isAddingCategoria, setIsAddingCategoria] = useState(false);
    const [newCategoriaName, setNewCategoriaName] = useState('');
    const [newCategoriaProv, setNewCategoriaProv] = useState('');
    const [editingCatId, setEditingCatId] = useState(null);
    
    // Lista de Categorías Globales
    const [categoriasList, setCategoriasList] = useState([
        { id: 1, nombre: 'Entrada', proveedor: 'Meypar' },
        { id: 2, nombre: 'Salida', proveedor: 'TGW' },
        { id: 3, nombre: 'Caja manual', proveedor: 'Local' },
        { id: 4, nombre: 'Cajero automático', proveedor: 'Importado' },
        { id: 5, nombre: 'Sistema de monitoreo', proveedor: 'Urbiotica' },
        { id: 6, nombre: 'Sistema de operación', proveedor: 'Acti' }
    ]);

    // Drawer Crear Grupo (Equipo)
    const [isCreateDrawerOpen, setIsCreateDrawerOpen] = useState(false);
    const [formGrupo, setFormGrupo] = useState(''); 
    const [formCategoria, setFormCategoria] = useState('');
    
    // Drawer Ver Detalle
    const [isDetailDrawerOpen, setIsDetailDrawerOpen] = useState(false);
    const [selectedDetail, setSelectedDetail] = useState(null);

    // Modal Añadir Componente
    const [isAddCompModalOpen, setIsAddCompModalOpen] = useState(false);
    const [compForm, setCompForm] = useState({ nombre: '', costo: '', moneda: 'USD', showCosto: false });
    
    // Tabla Principal
    const [equiposList, setEquiposList] = useState([]);

    const handleSaveCategoria = () => {
        if (!newCategoriaName || !newCategoriaProv) return;
        if (editingCatId) {
            setCategoriasList(categoriasList.map(c => c.id === editingCatId ? { ...c, nombre: newCategoriaName, proveedor: newCategoriaProv } : c));
            setEditingCatId(null);
        } else {
            setCategoriasList([...categoriasList, { id: Date.now(), nombre: newCategoriaName, proveedor: newCategoriaProv }]);
        }
        setNewCategoriaName('');
        setNewCategoriaProv('');
        setIsAddingCategoria(false);
    };

    const handleEditCategoria = (cat) => {
        setNewCategoriaName(cat.nombre);
        setNewCategoriaProv(cat.proveedor);
        setEditingCatId(cat.id);
        setIsAddingCategoria(true);
    };

    const handleDeleteCategoria = (id) => {
        setCategoriasList(categoriasList.filter(c => c.id !== id));
    };

    const getGeneratedCode = () => {
        if (!formGrupo || !formCategoria) return '------0000';
        const selectedCat = categoriasList.find(c => c.id.toString() === formGrupo);
        if (!selectedCat) return '------0000';
        
        const provPrefix = selectedCat.proveedor.substring(0, 3).toUpperCase();
        const catPrefix = selectedCat.nombre.substring(0, 3).toUpperCase();
        const inputPrefix = formCategoria.substring(0, 3).toUpperCase() || '---';
        
        return `${provPrefix}-${catPrefix}-${inputPrefix}-0000`;
    };

    const handleSaveEquipo = () => {
        if (!formGrupo || !formCategoria) return;
        const selectedCat = categoriasList.find(c => c.id.toString() === formGrupo);
        const newEquipo = {
            id: Date.now(),
            codigo: getGeneratedCode(),
            grupo: selectedCat.nombre,
            equipo: formCategoria,
            proveedor: selectedCat.proveedor,
            componentesCount: 0,
            componentes: []
        };
        setEquiposList([...equiposList, newEquipo]);
        setIsCreateDrawerOpen(false);
        setFormGrupo('');
        setFormCategoria('');
    };

    const handleOpenDetail = (equipo) => {
        setSelectedDetail(equipo);
        setIsDetailDrawerOpen(true);
    };

    const handleSaveComponente = () => {
        if (!compForm.nombre) return;
        
        const newComponente = {
            id: Date.now(),
            nombre: compForm.nombre,
            costo: compForm.showCosto ? parseFloat(compForm.costo || 0) : 0,
            moneda: compForm.moneda
        };

        const updatedComponentes = [...(selectedDetail.componentes || []), newComponente];
        
        const updatedEquipo = {
            ...selectedDetail,
            componentes: updatedComponentes,
            componentesCount: updatedComponentes.length
        };

        setSelectedDetail(updatedEquipo);
        setEquiposList(equiposList.map(eq => eq.id === updatedEquipo.id ? updatedEquipo : eq));
        setIsAddCompModalOpen(false);
        setCompForm({ nombre: '', costo: '', moneda: 'USD', showCosto: false });
    };

    // Auto-calculo del total de componentes en el Drawer
    const totalCostoComponentes = selectedDetail?.componentes?.reduce((sum, c) => sum + (c.costo || 0), 0) || 0;
    const monedaPredeterminada = selectedDetail?.componentes?.[0]?.moneda || 'USD';

    return (
        <div className="space-y-6 fade-up pb-10 max-w-[1400px] mx-auto">
            {/* Cabecera Principal */}
            <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 border-b border-slate-200 pb-4">
                <div className="flex items-start gap-4">
                    <div className="text-blue-500 mt-1"><ClipboardList size={28} strokeWidth={1.5}/></div>
                    <div>
                        <h2 className="text-[22px] font-medium text-slate-800 leading-tight">Plantilla de Proveedor</h2>
                        <p className="text-[13px] text-slate-500 mt-1">Gestiona los proveedores disponibles para los diferentes parqueaderos</p>
                    </div>
                </div>
                <div className="flex items-center gap-3">
                    <button onClick={() => setIsCreateDrawerOpen(true)} className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-lg text-[13px] font-medium transition-all flex flex-col items-center justify-center min-w-[100px] shadow-sm">
                        <Plus size={16} className="text-orange-500 mb-1" />
                        Crear Grupo
                    </button>
                </div>
            </div>

            {/* Panel Principal */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 min-h-[500px]">
                
                {/* Filtros */}
                <div className="flex justify-between items-end mb-6">
                    <div className="flex gap-4">
                        <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 block">BUSCAR</label>
                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="Buscar por nombre o código"
                                    className="appearance-none pl-4 pr-10 py-2 border border-slate-200 rounded-full text-[13px] text-slate-600 outline-none focus:border-blue-400 bg-white min-w-[250px] placeholder:text-slate-400" 
                                />
                            </div>
                        </div>
                        <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 block">CATEGORÍA</label>
                            <div className="relative">
                                <select className="appearance-none pl-4 pr-10 py-2 border border-slate-200 rounded-full text-[13px] text-slate-600 outline-none focus:border-blue-400 cursor-pointer bg-white min-w-[200px]">
                                    <option value="" disabled selected>Selecciona una opción</option>
                                    <option value="Meypar">Meypar</option>
                                    <option value="TGW">TGW</option>
                                </select>
                                <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none flex flex-col">
                                    <ChevronUp size={10} className="-mb-1"/>
                                    <ChevronDown size={10}/>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button 
                        onClick={() => { setIsCatDrawerOpen(true); setIsAddingCategoria(false); setEditingCatId(null); setNewCategoriaName(''); setNewCategoriaProv(''); }}
                        className="px-5 py-2.5 bg-white border border-blue-400 hover:bg-blue-50 text-blue-600 rounded-lg text-[13px] font-medium transition-all flex flex-col items-center justify-center min-w-[120px] shadow-sm"
                    >
                        <ClipboardList size={18} className="mb-1" />
                        Gestionar Categoría
                    </button>
                </div>

                {/* Tabla Principal Actualizada */}
                <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                        <thead className="border-b border-slate-100 bg-slate-50/50">
                            <tr>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">ID</th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                                    <div className="flex items-center gap-2"><Key size={14} className="opacity-50"/> CÓDIGO</div>
                                </th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                                    <div className="flex items-center gap-2"><User size={14} className="opacity-50"/> PROVEEDOR</div>
                                </th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                                    <div className="flex items-center gap-2"><Settings2 size={14} className="opacity-50"/> CATEGORÍA</div>
                                </th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                                    <div className="flex items-center gap-2"><Cpu size={14} className="opacity-50"/> NOMBRE DEL EQUIPO</div>
                                </th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                                    <div className="flex items-center gap-2"><Layers size={14} className="opacity-50"/> COMPONENTES</div>
                                </th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider text-right">
                                    <div className="flex items-center justify-end gap-2"><DollarSign size={14} className="opacity-50"/> COSTO TOTAL</div>
                                </th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider text-center">
                                    <div className="flex items-center justify-center gap-2"><Landmark size={14} className="opacity-50"/> MONEDA</div>
                                </th>
                                <th className="px-4 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-wider w-32"></th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-50">
                            {equiposList.length > 0 ? (
                                equiposList.map((eq, index) => {
                                    const calcTotal = eq.componentes?.reduce((sum, c) => sum + (c.costo || 0), 0) || 0;
                                    const calcMoneda = eq.componentes?.[0]?.moneda || 'USD';
                                    return (
                                        <tr key={eq.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="px-4 py-4 text-[13px] text-slate-600">{index + 1}</td>
                                            <td className="px-4 py-4 text-[13px] font-bold text-slate-800">{eq.codigo}</td>
                                            <td className="px-4 py-4 text-[13px] text-slate-600">{eq.proveedor}</td>
                                            <td className="px-4 py-4 text-[13px] text-slate-600">{eq.grupo}</td>
                                            <td className="px-4 py-4 text-[13px] font-medium text-slate-700">{eq.equipo}</td>
                                            <td className="px-4 py-4 text-[13px] text-slate-600">{eq.componentesCount}</td>
                                            <td className="px-4 py-4 text-[13px] font-bold text-emerald-600 text-right">
                                                {calcTotal > 0 ? calcTotal.toFixed(2) : '-'}
                                            </td>
                                            <td className="px-4 py-4 text-center">
                                                {calcTotal > 0 ? (
                                                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 rounded text-[11px] font-bold">{calcMoneda}</span>
                                                ) : '-'}
                                            </td>
                                            <td className="px-4 py-4 text-center">
                                                <button 
                                                    onClick={() => handleOpenDetail(eq)}
                                                    className="px-4 py-1.5 bg-[#004A7C] hover:bg-[#00365a] text-white rounded-full text-[11px] font-medium transition-all shadow-sm flex items-center justify-center gap-1.5 mx-auto whitespace-nowrap"
                                                >
                                                    <Eye size={14}/> Ver detalle
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })
                            ) : (
                                <tr>
                                    <td colSpan="9" className="py-20 text-center">
                                        <div className="flex flex-col items-center justify-center text-slate-400">
                                            <ClipboardList size={32} className="mb-3 opacity-50" />
                                            <p className="text-sm font-medium">No hay registros para mostrar</p>
                                        </div>
                                    </td>
                                </tr>
                            )}
                        </tbody>
                    </table>
                </div>
            </div>

            {}
            {/* DRAWER LATERAL: GESTIONAR CATEGORÍAS */}
            {isCatDrawerOpen && (
                <div className="fixed inset-0 z-[150] flex justify-end">
                    <div className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm transition-opacity" onClick={() => setIsCatDrawerOpen(false)} />
                    <div className="relative w-full max-w-[400px] h-full bg-white shadow-2xl flex flex-col animate-in slide-in-from-right duration-300 border-l border-slate-200">
                        <div className="flex justify-between items-center p-5 border-b border-slate-100 bg-white shrink-0">
                            <h3 className="text-[18px] font-medium text-slate-800">Categorías</h3>
                            <button onClick={() => setIsCatDrawerOpen(false)} className="text-blue-300 hover:text-blue-500 transition-colors"><X size={20} /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-2 bg-[#F8FAFC]">
                            {categoriasList.map((cat) => (
                                <div key={cat.id} className="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-100 shadow-sm">
                                    <div>
                                        <span className="text-[13px] text-slate-600 font-medium">{cat.nombre}</span>
                                        <span className="text-[10px] text-slate-400 block mt-0.5">{cat.proveedor}</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => handleEditCategoria(cat)} className="text-[#93C5FD] hover:text-blue-500 transition-colors"><Pencil size={16}/></button>
                                        <button onClick={() => handleDeleteCategoria(cat.id)} className="text-[#FCA5A5] hover:text-red-500 transition-colors"><Trash2 size={16}/></button>
                                    </div>
                                </div>
                            ))}
                            {isAddingCategoria && (
                                <div className="bg-white p-3 rounded-lg border-2 border-[#0EA5E9] shadow-sm animate-in zoom-in-95 duration-200 mt-4 flex flex-col gap-3">
                                    <div className="flex justify-between items-center">
                                        <input 
                                            type="text" 
                                            placeholder="Nombre de la categoría"
                                            className="w-full outline-none text-[13px] text-slate-700 bg-transparent placeholder:text-slate-300"
                                            value={newCategoriaName}
                                            onChange={(e) => setNewCategoriaName(e.target.value)}
                                            autoFocus
                                        />
                                        <div className="flex items-center gap-3 shrink-0 ml-2">
                                            <button onClick={handleSaveCategoria} className="text-[#F97316] hover:text-orange-600 transition-colors"><Check size={18} strokeWidth={2.5}/></button>
                                            <button onClick={() => { setIsAddingCategoria(false); setEditingCatId(null); setNewCategoriaName(''); setNewCategoriaProv(''); }} className="text-[#FCA5A5] hover:text-red-500 transition-colors"><Trash2 size={16}/></button>
                                        </div>
                                    </div>
                                    <div className="pt-2 border-t border-slate-100">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Proveedor</label>
                                        <select 
                                            value={newCategoriaProv}
                                            onChange={(e) => setNewCategoriaProv(e.target.value)}
                                            className="w-full appearance-none px-3 py-2 border border-slate-200 rounded text-[12px] text-slate-600 outline-none focus:border-[#0EA5E9] bg-slate-50 cursor-pointer"
                                        >
                                            <option value="" disabled>Seleccione un proveedor...</option>
                                            <option value="Meypar">Meypar</option>
                                            <option value="TGW">TGW</option>
                                            <option value="Local">Local</option>
                                            <option value="Importado">Importado</option>
                                            <option value="Urbiotica">Urbiotica</option>
                                            <option value="Acti">Acti</option>
                                        </select>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="p-4 border-t border-slate-100 bg-white flex justify-end shrink-0">
                            <button onClick={() => { setIsAddingCategoria(true); setEditingCatId(null); setNewCategoriaName(''); setNewCategoriaProv(''); }} className="flex flex-col items-center justify-center text-[#F97316] hover:text-orange-600 transition-colors px-4 py-2 rounded-lg hover:bg-orange-50">
                                <Plus size={20} />
                                <span className="text-[11px] font-medium mt-1">Agregar categoría</span>
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* DRAWER LATERAL: CREAR EQUIPO */}
            {isCreateDrawerOpen && (
                <div className="fixed inset-0 z-[150] flex justify-end">
                    <div className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm transition-opacity" onClick={() => setIsCreateDrawerOpen(false)} />
                    <div className="relative w-full max-w-[400px] h-full bg-white shadow-2xl flex flex-col animate-in slide-in-from-right duration-300 border-l border-slate-200">
                        <div className="flex justify-between items-center p-5 border-b border-slate-100 bg-white shrink-0">
                            <h3 className="text-[18px] font-medium text-slate-800">Crear equipo</h3>

                                        </td>
                                        <td className="px-6 py-5 text-center">
                                            <button className="p-1.5 border border-blue-200 text-blue-400 rounded hover:bg-blue-50 transition-colors">

                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    );
};

const RecaudacionView = ({ recaudaciones, setRecaudaciones }) => {
    const [showModal, setShowModal] = useState(false);
    const [detalleModal, setDetalleModal] = useState(null);
    const [form, setForm] = useState({ parqueadero: '', usuario: '', fecha: '', observaciones: '', observacionesDeposito: '' });
    const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
    const [concuerdaMonto, setConcuerdaMonto] = useState('si');
    const [uploads, setUploads] = useState({ planillas_pdf: null, planillas_xlsx: null, depositos_hora: null, depositos_abonados: null, datafast: null });
    const [activeUploadCategory, setActiveUploadCategory] = useState(null);

    const [filtroFecha, setFiltroFecha] = useState('');
    const [filtroEstado, setFiltroEstado] = useState('Todos');
    const [filtroParqueadero, setFiltroParqueadero] = useState('');

    const handleUpload = (key) => {
        setUploads(prev => ({ ...prev, [key]: 'loading' }));
        setTimeout(() => setUploads(prev => ({ ...prev, [key]: 'done' })), 1000);
    };

    const getLocalDateStr = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    };

    const todayObj = new Date();
    const maxDateStr = getLocalDateStr(todayObj);
    const minDateObj = new Date(todayObj);
    minDateObj.setDate(minDateObj.getDate() - 3);
    const minDateStr = getLocalDateStr(minDateObj);

    const handleSave = () => {
        if (!form.parqueadero || !form.usuario || !form.fecha) return;
        const uploadedCount = Object.keys(uploads).filter(k => uploads[k] === 'done').length;
        const efe = (Math.random() * 200).toFixed(2);
        const tar = (Math.random() * 100).toFixed(2);
        const trans = (Math.random() * 50).toFixed(2);
        const cred = (Math.random() * 50).toFixed(2);
        const total = (parseFloat(efe) + parseFloat(tar) + parseFloat(trans) + parseFloat(cred)).toFixed(2);
        const cCosto = '022' + Math.floor(1000 + Math.random() * 9000).toString();
        const obsDepositoFinal = concuerdaMonto === 'no' ? form.observacionesDeposito : '';
        const estadoFinal = form.fecha === maxDateStr ? 'Cargado Fuera de Tiempo' : 'Cargado';

        const newRecaudacion = {
            id: 'REC-' + Math.floor(Math.random() * 1000000),
            centroCosto: cCosto,
            ...form,
            observacionesDeposito: obsDepositoFinal,
            archivos: uploadedCount,
            uploads: { ...uploads },
            estado: estadoFinal,
            montoEfectivo: efe,
            montoTarjeta: tar,
            montoTransferencia: trans,
            montoCredito: cred,
            monto: total
        };
        setRecaudaciones(prev => [newRecaudacion, ...prev]);
        setShowModal(false);
        setForm({ parqueadero: '', usuario: '', fecha: '', observaciones: '', observacionesDeposito: '' });
        setUploads({ planillas_pdf: null, planillas_xlsx: null, depositos_hora: null, depositos_abonados: null, datafast: null });
        setActiveUploadCategory(null);
        setConcuerdaMonto('si');
    };

    const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction });
    };

    const isPlanillasDone = uploads.planillas_pdf === 'done' || uploads.planillas_xlsx === 'done';
    const isDepositosDone = uploads.depositos_hora === 'done' || uploads.depositos_abonados === 'done';
    const isDatafastDone = uploads.datafast === 'done';

    const filteredRecaudaciones = recaudaciones.filter(rec => {
        const matchFecha = !filtroFecha || rec.fecha === filtroFecha;
        const matchEstado = filtroEstado === 'Todos' || rec.estado === filtroEstado;
        const matchParqueadero = !filtroParqueadero || rec.parqueadero.toLowerCase().includes(filtroParqueadero.toLowerCase());
        return matchFecha && matchEstado && matchParqueadero;
    });

    const sortedRecaudaciones = [...filteredRecaudaciones].sort((a, b) => {
        if (!sortConfig.key) return 0;
        const aValue = a[sortConfig.key] || '';
        const bValue = b[sortConfig.key] || '';
        if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
        if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
    });

    const totalMonto = filteredRecaudaciones.reduce((sum, rec) => sum + parseFloat(rec.monto || 0), 0);
    const summaryDateText = filtroFecha ? filtroFecha : 'Todas las fechas';

                    </div>
                </div>
            )}
        </div>
    );
};
